services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: smart_farming_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app/backend
      - ../logic_companion_planting:/app/logic_companion_planting:ro
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/smart_farming
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: smart_farming_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_farming
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
