name: Smart Urban Farming System - CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint, Test, and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 1: Reclaim runner disk space before anything else runs
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog

      # STEP 2: Install CPU-only PyTorch first, then install requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Force PyTorch to CPU-only (~300MB instead of ~8GB CUDA packages)
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          
          # Install the rest of the project requirements
          pip install --no-cache-dir -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && break
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run Linter (flake8) and Formatter (black)
        env:
          PYTHONPATH: ./backend
        run: |
          flake8 . --exclude=backend/alembic/versions/*
          black --check . --exclude "backend/alembic/versions/.*"

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          PYTHONPATH: ./backend
        run: pytest --cov=app --cov-report=term --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml